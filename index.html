<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SubDownloader | Sinhala Subtitle Downloader</title>
    <meta name="description" content="Download Sinhala Subtitles for movies and TV shows from Baiscope, Cineru, PirateLK, and Zoom. Modern, fast, and beautiful.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="glow-container">
        <div class="glow-orb" id="orb-1"></div>
        <div class="glow-orb" id="orb-2"></div>
        <div class="glow-orb" id="orb-3"></div>
    </div>

    <div class="app-container">
        <header>
            <div class="logo">
                <img src="logo.png" alt="SubDownloader Logo" class="main-logo">
                <h1>Sub<span>Downloader</span></h1>
            </div>
            <p class="subtitle">Sinhala Subtitle හොයන්න ලේසිම ක්‍රමය!</p>
        </header>

        <section class="search-section">
            <div class="search-box">
                <div class="search-input-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                    <input type="text" id="query" placeholder="Movie නම මෙතන type කරන්න..." autocomplete="off">
                    <button id="searchBtn">
                        <span class="btn-text">Search</span>
                        <div class="loader" id="btnLoader"></div>
                    </button>
                </div>
                <div class="site-filters">
                    <button class="filter-chip active" data-site="all">All</button>
                    <button class="filter-chip" data-site="baiscope">Baiscope</button>
                    <button class="filter-chip" data-site="cineru">Cineru</button>
                    <button class="filter-chip" data-site="piratelk">PirateLK</button>
                    <button class="filter-chip" data-site="zoom">Zoom</button>
                </div>
            </div>
        </section>

        <main id="results-container">
            <div class="initial-msg">
                <div class="icon-box">🍿</div>
                <h3>ලස්සන මූවි එකක උපසිරැසි සිංහලෙන්ම හොයමු!</h3>
                <p>ඔබට අවශ්‍ය මූවි එකේ නම උඩ සර්ච් එකේ ටයිප් කරන්න.</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 SubDownloader. Powered by <span>TheCHARITH API</span></p>
        </footer>
    </div>

    <!-- Modal for Download -->
    <div id="dl-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="modal-body">
                <div class="dl-loader"></div>
                <p>Preparing your download link...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
